name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm lint && pnpm check && pnpm test && pnpm validate:catalog

      - name: Build portal
        run: GAMECLAW_BASE=/gameclaw/ pnpm --filter @gameclaw/web build

      - name: Publish notes-only GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --notes "$(cat <<'MD'
Play at https://arcobalneo.github.io/gameclaw/

This tag records a web release. There are no CLI binaries. The site (`gh-pages`)
and the relay (`wrangler deploy`) are published separately; see
`docs/release-flow.md`.
MD
)"
