name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm lint && pnpm check && pnpm test && pnpm validate:catalog

      - name: Build portal
        run: GAMECLAW_BASE=/gameclaw/ pnpm --filter @gameclaw/web build

      - name: Publish notes-only GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Play at https://arcobalneo.github.io/gameclaw/

            This tag records a web release. There are no CLI binaries.
            The site and the relay are published separately; see `docs/release-flow.md`.
